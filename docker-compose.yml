services:
  card-auto:
    build: .
    container_name: card-auto-server
    depends_on:
      - payment-python
    env_file:
      - .env
    ports:
      - "81:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PAYMENT_SERVICE_ORIGIN=http://payment-python:5001
      - REAL_API_KEY=${REAL_API_KEY:-}
      - INVITER_CODE=${INVITER_CODE:-}
      - DEVICE_ID=${DEVICE_ID:-browser-fingerprint}
    volumes:
      - ./redeem_history.db:/app/redeem_history.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  payment-python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: card-auto-payment-python
    environment:
      - PAYMENT_SERVICE_HOST=0.0.0.0
      - PAYMENT_SERVICE_PORT=5001
    ports:
      - "5001:5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
